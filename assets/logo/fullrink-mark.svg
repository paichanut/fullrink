<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="FullRink mark">
  <defs>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E2A47"/>
      <stop offset="1" stop-color="#071628"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect x="4" y="4" width="120" height="116" rx="28" fill="url(#ice)"/>
  <!-- rink outline (full rink, top-down) -->
  <rect x="18" y="30" width="92" height="64" rx="22" fill="none" stroke="#5EC8F2" stroke-width="5"/>
  <!-- blue lines -->
  <line x1="46" y1="30" x2="46" y2="94" stroke="#5EC8F2" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <line x1="82" y1="30" x2="82" y2="94" stroke="#5EC8F2" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <!-- centre red line -->
  <line x1="64" y1="30" x2="64" y2="94" stroke="#FF3B57" stroke-width="5" stroke-linecap="round"/>
  <!-- centre circle -->
  <circle cx="64" cy="62" r="13" fill="#0B1B2B" stroke="#FF3B57" stroke-width="4"/>
  <!-- puck -->
  <ellipse cx="64" cy="62" rx="5" ry="3.5" fill="#F5F8FB"/>
</svg>
